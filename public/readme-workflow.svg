<text x="70" y="132" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">A GitHub-ready overview of how reports move through the app</text>
<rect x="70" y="190" width="250" height="360" rx="20" fill="#111C2A" stroke="#334155"/>
