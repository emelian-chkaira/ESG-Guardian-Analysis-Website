<path d="M195 230L210 236V251C210 262.5 204.3 272.4 195 278C185.7 272.4 180 262.5 180 251V236L195 230Z" fill="#CCFBF1"/>
<text x="110" y="314" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1. Upload PDF</text>
<text x="98" y="356" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">Drag and drop a bank</text>
<text x="100" y="382" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">sustainability report.</text>
<text x="102" y="436" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="17">Accepted input:</text>
<text x="102" y="464" fill="#2DD4BF" font-family="Arial, Helvetica, sans-serif" font-size="17">.pdf documents</text>
<circle cx="480" cy="246" r="26" fill="#1D4ED8"/>
<rect x="466" y="232" width="28" height="28" rx="6" fill="#DBEAFE"/>
<text x="375" y="314" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2. Extract Text</text>
<text x="386" y="356" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">`pdf.js` parses pages</text>
<text x="389" y="382" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">locally in the browser.</text>
<text x="387" y="436" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="17">Privacy mode:</text>
<text x="387" y="464" fill="#38BDF8" font-family="Arial, Helvetica, sans-serif" font-size="17">no data leaves the machine</text>
<circle cx="765" cy="246" r="26" fill="#F59E0B"/>
<rect x="752" y="236" width="26" height="20" rx="4" fill="#FEF3C7"/>
<text x="667" y="314" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">3. Run Rules</text>
<text x="662" y="356" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">19 regex-based checks</text>
<text x="665" y="382" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">scan ESG disclosures.</text>
<text x="672" y="436" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="17">Coverage:</text>
<text x="672" y="464" fill="#FBBF24" font-family="Arial, Helvetica, sans-serif" font-size="17">ESRS, EBA, Taxonomy</text>
<circle cx="1050" cy="246" r="26" fill="#7C3AED"/>
<rect x="1037" y="234" width="26" height="24" rx="4" fill="#EDE9FE"/>
<text x="954" y="314" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">4. Review Results</text>
<text x="961" y="356" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">Dashboard groups pass,</text>
<text x="950" y="382" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">fail, and missing items.</text>
<text x="957" y="436" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="17">Output:</text>
<text x="957" y="464" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="17">pillar cards and rule detail</text>
